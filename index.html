<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>工作台入口</title>
<style>
  :root{
    --bg:#f5f6f8; --card:#ffffff; --ink:#1c1f23; --sub:#6b7280;
    --line:rgba(0,0,0,.08); --brand:#2f6fed; --brand-soft:#eaf1fe;
    --ok:#12805c; --warn:#b45309;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161a; --card:#1c1f24; --ink:#e8eaed; --sub:#9aa1ac;
      --line:rgba(255,255,255,.10); --brand:#6f9bff; --brand-soft:#1e2a44;
      --ok:#3ecf9a; --warn:#e0a44a;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    -webkit-text-size-adjust:100%;
  }
  .card{
    width:100%; max-width:430px; background:var(--card);
    border:1px solid var(--line); border-radius:18px;
    padding:26px 22px 20px; box-shadow:0 8px 30px rgba(0,0,0,.06);
  }
  h1{font-size:17px; margin:0 0 4px; letter-spacing:.2px}
  .lead{font-size:13px; color:var(--sub); margin:0 0 20px; line-height:1.6}

  .go{
    display:flex; align-items:center; justify-content:center; gap:8px;
    min-height:52px; border-radius:12px; background:var(--brand); color:#fff;
    font-size:16px; font-weight:600; text-decoration:none; letter-spacing:.3px;
  }
  .go:active{opacity:.86}
  .go svg{width:17px;height:17px;flex:0 0 auto}

  .row{margin-top:16px}
  .lab{font-size:12px; color:var(--sub); margin-bottom:6px; letter-spacing:.3px}
  .val{
    display:flex; align-items:center; gap:8px;
    background:var(--brand-soft); border-radius:10px; padding:11px 12px;
    font-size:13px; line-height:1.5; word-break:break-all;
  }
  .val code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:13px}
  .mini{
    margin-left:auto; flex:0 0 auto; border:1px solid var(--line);
    background:transparent; color:var(--sub); border-radius:7px;
    font-size:12px; padding:4px 9px; cursor:pointer; min-height:28px;
    font-family:inherit;
  }
  .mini:active{background:rgba(127,127,127,.12)}
  .mini.done{color:var(--ok); border-color:var(--ok)}

  .tip{
    margin-top:16px; padding-top:14px; border-top:1px solid var(--line);
    font-size:12px; color:var(--sub); line-height:1.7;
  }
  .tip b{color:var(--ink); font-weight:600}
  .foot{
    margin-top:12px; font-size:11px; color:var(--sub); text-align:center; line-height:1.7;
  }
  .pill{
    display:inline-block; padding:1px 7px; border-radius:20px;
    font-size:11px; background:var(--brand-soft); color:var(--brand);
  }
</style>
</head>
<body>
  <main class="card">
    <h1>学术工作台 · 公网入口</h1>
    <p class="lead">这个链接永远不变。手机在外面用流量也能打开，数据仍在你自己的电脑上。</p>

    <a class="go" href="https://7d2189f3766760.lhr.life" rel="noreferrer">
      进入工作台
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M5 12h13M13 6l6 6-6 6"/>
      </svg>
    </a>

    <div class="row">
      <div class="lab">当前地址</div>
      <div class="val">
        <code id="u">https://7d2189f3766760.lhr.life</code>
        <button class="mini" id="bu" type="button">复制</button>
      </div>
    </div>

    <div class="row">
      <div class="lab">访问口令</div>
      <div class="val">
        <code id="t" data-v="kjeyhfmzvta4">••••••••••••</code>
        <button class="mini" id="bt" type="button">显示</button>
      </div>
    </div>

    <p class="tip">
      <b>首次打开会弹登录框</b>：用户名随便填，密码填上面的口令。<br>
      浏览器会记住，之后不用再输。<br>
      <b>打不开？</b>说明电脑没开机或隧道正在重连 —— 等一两分钟刷新本页即可。
    </p>

    <div class="foot">
      <span class="pill">更新于 2026-09-22 19:34</span><br>
      页面公开可访问，请勿转发
    </div>
  </main>

<script>
(function () {
  function flash(btn, text) {
    var old = btn.textContent;
    btn.textContent = text;
    btn.classList.add('done');
    setTimeout(function () { btn.textContent = old; btn.classList.remove('done'); }, 1400);
  }
  function copy(text, btn) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { flash(btn, '已复制'); },
        function () { fallback(text, btn); });
    } else { fallback(text, btn); }
  }
  function fallback(text, btn) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); flash(btn, '已复制'); }
    catch (e) { flash(btn, '请长按'); }
    document.body.removeChild(ta);
  }

  var urlEl = document.getElementById('u');
  var tokEl = document.getElementById('t');
  var bu = document.getElementById('bu');
  var bt = document.getElementById('bt');

  bu.addEventListener('click', function () { copy(urlEl.textContent.trim(), bu); });

  bt.addEventListener('click', function () {
    var shown = tokEl.getAttribute('data-shown') === '1';
    if (shown) {
      tokEl.textContent = '••••••••••••';
      tokEl.setAttribute('data-shown', '0');
      bt.textContent = '显示';
    } else {
      tokEl.textContent = tokEl.getAttribute('data-v') || '(未设置)';
      tokEl.setAttribute('data-shown', '1');
      bt.textContent = '隐藏';
    }
  });
})();
</script>
</body>
</html>
